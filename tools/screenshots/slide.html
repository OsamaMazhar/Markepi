<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --W: 1320px; --H: 2868px; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: #000; }
  body { font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: var(--W); height: var(--H); overflow: hidden; }

  /* ---- background: base gradient + blurred colour blooms + light rays + grain + vignette ---- */
  .bg, .blooms, .rays, .grain, .vig { position: absolute; inset: 0; }
  .blooms { filter: blur(150px) saturate(1.15); }
  .bloom { position: absolute; border-radius: 50%; }
  .rays { mix-blend-mode: soft-light; opacity: .22; filter: blur(6px); }
  .grain { opacity: .14; mix-blend-mode: overlay; }
  .vig { background: radial-gradient(120% 80% at 50% 45%, transparent 55%, rgba(0,0,0,.35) 100%); }

  /* ---- caption ---- */
  .cap { position: absolute; left: 0; right: 0; top: 150px; text-align: center; color: #fff; padding: 0 90px; }
  .chip { display: inline-block; font-size: 52px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
          padding: 16px 34px; border-radius: 999px; margin-bottom: 34px;
          background: rgba(255,255,255,.16); border: 1.5px solid rgba(255,255,255,.35); backdrop-filter: blur(20px); }
  h1 { font-size: 172px; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em;
       text-shadow: 0 6px 40px rgba(0,0,0,.25); }
  .sub { margin-top: 36px; font-size: 66px; line-height: 1.2; font-weight: 500; opacity: .88; letter-spacing: -0.01em; }
  .dark .cap { color: #13131a; } .dark h1 { text-shadow: none; } .dark .chip { background: rgba(255,255,255,.55); border-color: rgba(0,0,0,.08); }

  /* ---- phone (flat) ---- */
  .phone { position: absolute; left: 50%; transform: translateX(-50%); filter: drop-shadow(0 60px 90px rgba(0,0,0,.45)) drop-shadow(0 18px 30px rgba(0,0,0,.25)); }
  .screen { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            -webkit-mask-image: url(screen_mask.png); -webkit-mask-size: 100% 100%; mask-image: url(screen_mask.png); mask-size: 100% 100%; overflow: hidden; }
  .screen img { position: absolute; }
  .frame { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---- pop-out ---- */
  .popwrap { position: absolute; perspective: 2200px; }
  .pop { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
  .pop img { width: 100%; height: 100%; display: block; border-radius: 10px;
             box-shadow: 0 90px 160px rgba(0,0,0,.50), 0 40px 60px rgba(0,0,0,.28), 0 8px 16px rgba(0,0,0,.2); }
  .pop .sheen { position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
                background: linear-gradient(115deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 70%, rgba(255,255,255,.08) 100%); mix-blend-mode: screen; }
  .play { position: absolute; left: 50%; top: 50%; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%;
          background: rgba(255,255,255,.28); backdrop-filter: blur(18px); border: 2px solid rgba(255,255,255,.55); }
  .play:after { content: ""; position: absolute; left: 78px; top: 58px; border-left: 64px solid #fff; border-top: 42px solid transparent; border-bottom: 42px solid transparent; }
  .pills { position: absolute; display: flex; gap: 18px; justify-content: center; left: 0; right: 0; }
  .pill { font-size: 40px; font-weight: 700; color: #fff; padding: 18px 30px; border-radius: 999px;
          background: rgba(20,20,28,.55); backdrop-filter: blur(20px); border: 1.5px solid rgba(255,255,255,.25);
          box-shadow: 0 20px 40px rgba(0,0,0,.3); }
</style></head>
<body><div id="stage"></div>
<script>
// Each slide: caption, palette (base + blooms), the simulator capture (`cap`), and what lifts out of it:
// the framed photo render (`pop/<photo>_web.jpg`, placed over the capture's preview rect) or, with `crop`,
// a controls panel cut from the capture itself (`cap/<crop>-crop.png`, placed exactly where it sits).
const P = {
  blue:  { base: ["#12143f", "#2b3aa0"], blooms: ["#3f5bd8", "#e0703a", "#f4b860", "#6d4bd8"] },
  gold:  { base: ["#07060c", "#1a1208"], blooms: ["#d9a54a", "#7a1d1d", "#f3dfb0", "#3a2a10"] },
  dusk:  { base: ["#3b3f7a", "#b9a6d6"], blooms: ["#f6c7a8", "#8f86d9", "#fff1e0", "#5a6aa8"] },
  sky:   { base: ["#0f2a6b", "#3b82f6"], blooms: ["#fde7c7", "#60a5fa", "#fbbf24", "#1e3a8a"] },
  teal:  { base: ["#062b2a", "#0f766e"], blooms: ["#14b8a6", "#99f6e4", "#0f1f45", "#10b981"] },
  alps:  { base: ["#0e1f35", "#35597f"], blooms: ["#a5c8f0", "#6b8cae", "#eef5ff", "#1e3a5f"] },
  pink:  { base: ["#3b0f3a", "#d6247a"], blooms: ["#f5c518", "#ff6b4a", "#d6247a", "#7c1d6f"] },
  slate: { base: ["#0b0f14", "#12303a"], blooms: ["#14b8a6", "#22d3ee", "#334155", "#0e7490"] },
};
const T = {
  frames: { chip: "New", h: "12 new<br>photo frames", sub: "White borders, soft shadows and light,<br>coloured by your own shot." },
  tune:   { h: "Custom<br>photo borders", sub: "Border size, caption, keyline and more,<br>per style or for all." },
  text:   { h: "Add text<br>to photos", sub: "Your name or studio in beautiful fonts,<br>on photos and videos." },
  logo:   { h: "Add your logo<br>&amp; signature", sub: "Transparent PNG logos and a handwritten<br>signature, placed perfectly." },
};
const SLIDES = {
  "01":  { ...P.blue, cap: "01-hero-aura", photo: "01", chip: "Photo & video watermark", h: "Watermark &amp;<br>frame your photos", sub: "The photo editor that frames, watermarks<br>and shares in one tap." },
  "02b": { ...P.gold, ...T.frames, cap: "02b-frames-noir", photo: "02" },
  "02c": { ...P.gold, ...T.tune, cap: "02-frame-panel-noir", crop: "02c" },
  "03":  { ...P.dusk, cap: "03-readout-exif", photo: "03", h: "Real EXIF<br>on every frame", sub: "EXIF metadata: camera, lens, aperture,<br>shutter and ISO, added automatically.", pills: ["24mm", "ƒ/1.8", "1/121", "ISO 100"] },
  "04b": { ...P.sky, ...T.text, cap: "04b-text", photo: "04" },
  "04c": { ...P.sky, ...T.text, cap: "04-text-watermark", crop: "04c" },
  "05b": { ...P.teal, ...T.logo, cap: "05b-logo", photo: "05" },
  "05c": { ...P.teal, ...T.logo, cap: "05-logo", crop: "05c" },
  "06":  { ...P.alps, cap: "06-video", photo: "06", play: true, h: "Watermark<br>videos too", sub: "The same frames and marks<br>on every clip." },
  "07c": { ...P.pink, cap: "07b-share-editor", crop: "07c", h: "Share<br>instantly", sub: "Watermarked photos straight to any app.<br>No camera-roll clutter." },
  // v2.0 set: new captures under cap/v2/<device>/, pop-outs rendered by the engine.
  "v01": { ...P.blue, cap: "v2/iphone/01-hero-aura", pop: "cap/v2/iphone/01-hero-aura-pop.jpg", chip: "Photo & video watermark", h: "Frame &amp; mark<br>your photos", sub: "Frames, watermarks and looks,<br>then share in one tap." },
  "v03": { ...P.dusk, cap: "v2/iphone/03-looks-film", crop: "v2/iphone/03-looks-film", chip: "New", h: "Film looks<br>&amp; moods", sub: "Moods, skin undertones and film stocks,<br>with your HDR kept intact." },
  "v05": { ...P.teal, cap: "v2/iphone/02-frame-panel", crop: "v2/iphone/02-frame-panel", h: "Your frame,<br>your details", sub: "Camera, exposure, date, landmark,<br>city or country. Tap to add." },
  "v06": { ...P.sky, ...T.text, cap: "v2/iphone/04-text", pop: "cap/v2/iphone/04-text-pop.jpg" },
  "v07": { ...P.pink, ...T.logo, sub: "Transparent PNG logos and signatures,<br>placed exactly where you want.", cap: "v2/iphone/05-logo", pop: "cap/v2/iphone/05-logo-pop.jpg" },
  "s1":  { ...P.gold, custom: "styles", chip: "16 frame styles", h: "Every frame,<br>one tap away", sub: "Gallery, banner, glow, aura and more,<br>each with your real camera details." },
  "l1":  { ...P.dusk, custom: "looks", chip: "New · 22 photo looks", h: "A look for<br>every moment", sub: "Moods, skin undertones and film stocks,<br>made on device from your photo." },
  "m1":  { ...P.sky, custom: "masks", chip: "New · Photo looks", h: "Looks that see<br>hair, skin &amp; sky", sub: "Each part of the photo is found on device,<br>so every look keeps faces natural." },
  "08c": { ...P.slate, cap: "08b-c2pa-signed", crop: "08c", h: "Protect photos<br>with C2PA", sub: "Creator and copyright sealed in<br>with Content Credentials." },
};

const q = new URLSearchParams(location.search), id = q.get("s") || "01";
const IPAD = q.get("d") === "i";
const S = SLIDES[id];

// Seeded RNG so a slide renders the same every time.
let seed = parseInt(id) * 9301 + 49297 + id.length; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);

const getCap = () => document.querySelector(".cap");

// Slides without a phone: the engine's own renders laid out on the slide background.
async function customSlide(S, st, W, H, cap) {
  const BAND_TOP = 90, TOP = 770;
  cap.style.top = `${BAND_TOP + (TOP - 40 - BAND_TOP - cap.offsetHeight) / 2}px`;
  const label = (t, x, y, w) => `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;text-align:center;color:#fff;font-size:40px;font-weight:700;letter-spacing:.02em;text-shadow:0 4px 18px rgba(0,0,0,.4)">${t}</div>`;
  const shadow = "box-shadow:0 40px 80px rgba(0,0,0,.45),0 12px 24px rgba(0,0,0,.25);border-radius:8px";
  if (S.custom === "styles" || S.custom === "looks") {
    const looks = S.custom === "looks", dir = looks ? "looks" : "styles";
    const names = (looks ? "original vibrant luminous dramatic cozy ethereal starkBW roseGold gold golden200 chrome100 velvet50 classicNeg tungsten800 silver400 faded"
                         : "classic print gallery banner float tone swatch spine noir readout ambient aura blend emboss sunlight glow").split(" ");
    const titles = { starkBW: "Stark B&amp;W", roseGold: "Rose Gold", golden200: "Golden 200", chrome100: "Chrome 100", velvet50: "Velvet 50",
                     classicNeg: "Classic Neg", tungsten800: "Tungsten 800", silver400: "Silver 400" };
    const cols = W > 1500 ? 6 : 4, rows = Math.ceil(names.length / cols), gap = 34, side = 70, cw = (W - side * 2 - gap * (cols - 1)) / cols, lh = 64;
    const ch = (H - TOP - 60 - lh * rows - gap * (rows - 1)) / rows;
    for (const [i, n] of names.entries()) {
      const img = new Image(); img.src = `cap/v2/${dir}/${n}.jpg`; await img.decode();
      const k = Math.min(cw / img.naturalWidth, ch / img.naturalHeight), w = img.naturalWidth * k, h = img.naturalHeight * k;
      // A short last row is centred under the full ones.
      const row = Math.floor(i / cols), inRow = Math.min(cols, names.length - row * cols);
      const x = side + (cols - inRow) * (cw + gap) / 2 + (i % cols) * (cw + gap), y = TOP + row * (ch + lh + gap);
      st.insertAdjacentHTML("beforeend", `<img src="${img.src}" style="position:absolute;left:${x + (cw - w) / 2}px;top:${y + (ch - h)}px;width:${w}px;height:${h}px;${shadow}">`
        + label(titles[n] || n[0].toUpperCase() + n.slice(1), x, y + ch + 14, cw));
    }
  } else {
    // The photo large, then what the look sees: hair, skin and sky.
    const big = new Image(); big.src = "cap/v2/photo.jpg"; await big.decode();
    const tilesH = 640, lh = 64, gap = 40, side = 80;
    const bh = H - TOP - 80 - tilesH - lh - 70, bw = bh * big.naturalWidth / big.naturalHeight;
    st.insertAdjacentHTML("beforeend", `<img src="${big.src}" style="position:absolute;left:${(W - bw) / 2}px;top:${TOP}px;width:${bw}px;height:${bh}px;${shadow};border-radius:24px">`);
    const ar = big.naturalHeight / big.naturalWidth, tw = Math.min((W - side * 2 - gap * 2) / 3, tilesH / ar), th = tw * ar, ty = H - 80 - lh - th;
    const tx0 = (W - tw * 3 - gap * 2) / 2;
    for (const [i, [n, t]] of [["hair", "Hair"], ["skin", "Skin"], ["sky", "Sky"]].entries()) {
      const x = tx0 + i * (tw + gap);
      st.insertAdjacentHTML("beforeend", `<img src="cap/v2/mask_${n}.jpg" style="position:absolute;left:${x}px;top:${ty}px;width:${tw}px;height:${th}px;${shadow};border-radius:20px;border:3px solid rgba(255,255,255,.7)">`
        + label(t, x, ty + th + 14, tw));
    }
    // Connectors from the photo down to each tile.
    const yTop = TOP + bh + 12, yBot = ty - 12;
    st.insertAdjacentHTML("beforeend", `<svg style="position:absolute;left:0;top:0" width="${W}" height="${H}">${[0, 1, 2].map(i => {
      const x = tx0 + i * (tw + gap) + tw / 2; return `<path d="M${W / 2} ${yTop} C ${W / 2} ${(yTop + yBot) / 2}, ${x} ${(yTop + yBot) / 2}, ${x} ${yBot}" stroke="rgba(255,255,255,.75)" stroke-width="5" fill="none" stroke-dasharray="4 14" stroke-linecap="round"/>`; }).join("")}</svg>`);
  }
}

async function main() {
  const phone = IPAD ? { phone: [1720, 2294], screen: [0, 0, 1720, 2294] } : await fetch("phone.json").then(r => r.json());
  const cap = S.cap;
  const meta = S.custom ? null : S.crop ? await fetch(`${IPAD ? "capi" : "cap"}/${S.crop}-crop.json`).then(r => r.json()) : await fetch(`${IPAD ? "capi" : "cap"}/${cap}.json`).then(r => r.json());
  const st = document.getElementById("stage");
  const W = IPAD ? 2064 : 1320, H = IPAD ? 2752 : 2868;
  document.documentElement.style.setProperty("--W", W + "px");
  document.documentElement.style.setProperty("--H", H + "px");

  // Background
  st.insertAdjacentHTML("beforeend", `<div class="bg" style="background:linear-gradient(165deg, ${S.base[0]} 0%, ${S.base[1]} 100%)"></div><div class="blooms"></div><div class="rays"></div>
    <svg class="grain" width="${W}" height="${H}"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg><div class="vig"></div>`);
  const bl = st.querySelector(".blooms");
  S.blooms.forEach((c, i) => {
    const s = 700 + rnd() * 700, x = (i % 2 ? .6 : -.1) * W + rnd() * 300, y = (i < 2 ? .05 : .5) * H + rnd() * 900;
    bl.insertAdjacentHTML("beforeend", `<div class="bloom" style="width:${s}px;height:${s}px;left:${x}px;top:${y}px;background:${c};opacity:${.55 + rnd() * .35}"></div>`);
  });
  st.querySelector(".rays").style.background = `repeating-conic-gradient(from ${200 + rnd() * 40}deg at ${20 + rnd() * 60}% -10%, rgba(255,255,255,.35) 0deg 3deg, rgba(255,255,255,0) 3deg 11deg)`;

  // Caption
  st.insertAdjacentHTML("beforeend", `<div class="cap">${S.chip ? `<div class="chip">${S.chip}</div>` : ""}<h1>${S.h}</h1><div class="sub">${S.sub}</div></div>`);
  if (S.custom) { await customSlide(S, st, W, H, getCap()); await Promise.all([...document.images].map(i => i.decode().catch(() => {}))); window.DONE = true; return; }
  // Same phone position on every slide; the caption block is centred in the band above it.
  const capEl = st.querySelector(".cap"), BAND_TOP = 90, PHONE_TOP = IPAD ? 640 : 770;
  capEl.style.top = `${BAND_TOP + (PHONE_TOP - 40 - BAND_TOP - capEl.offsetHeight) / 2}px`;
  const capBottom = PHONE_TOP - 70;

  // Phone: flat, as wide as the layout allows, top just under the caption, bottom bleeding off the canvas.
  // Phone starts just under the caption and grows to fill the canvas, bleeding ~260px off the bottom; never wider than 1180.
  const top = capBottom + 70, PW = Math.min(1180, (H - top + 260) * phone.phone[0] / phone.phone[1]);
  const k = PW / phone.phone[0], PH = phone.phone[1] * k;
  const [sx, sy, sw, sh] = phone.screen.map(v => v * k);
  st.insertAdjacentHTML("beforeend", `<div class="phone" style="width:${PW}px;height:${PH}px;top:${top}px">
    <div class="screen" ${IPAD ? 'style="-webkit-mask-image:none;mask-image:none;border-radius:56px"' : ""}><img src="cap/${cap}.png" style="left:${sx}px;top:${sy}px;width:${sw}px;height:${sh}px;object-fit:cover"></div>
    ${IPAD ? "" : '<img class="frame" src="frame.png">'};</div>`);

  // Pop-out: map its rect from capture pixels to canvas pixels, then lift it around its centre.
  const pop = new Image(); pop.src = S.crop ? `${IPAD ? "capi" : "cap"}/${S.crop}-crop.png` : S.pop ? (IPAD ? S.pop.replace("/iphone/", "/ipad/") : S.pop) : `pop/${S.photo}_web.jpg`; await pop.decode();
  const cs = sw / (IPAD ? 2064 : 1320); // capture px -> canvas px
  let [rx, ry, rw, rh] = S.crop ? meta.crop : meta.preview;
  if (!S.crop) { // fit the render inside the preview rect, as the app does
    const ar = pop.naturalWidth / pop.naturalHeight;
    if (rw / rh > ar) { const w = rh * ar; rx += (rw - w) / 2; rw = w; } else { const h = rw / ar; ry += (rh - h) / 2; rh = h; }
  }
  const cx = (W - PW) / 2 + sx + (rx + rw / 2) * cs, cy = top + sy + (ry + rh / 2) * cs;
  // Photos get the same presence (about the phone's width, or 1350px tall); controls lift 12% off their exact spot.
  let pw, ph;
  if (S.crop) { pw = rw * cs * 1.2; ph = rh * cs * 1.2; }
  else if (IPAD) { pw = rw * cs * 1.08; ph = pw * rh / rw; if (ph > 1560) { ph = 1560; pw = ph * rw / rh; } }
  else { pw = Math.max(rw * cs * 1.14, PW * 0.98); ph = pw * rh / rw; if (ph > 1350) { ph = 1350; pw = ph * rw / rh; }
         // Never smaller than the photo it lifts from, or the capture's own frame shows around it.
         if (pw < rw * cs * 1.06) { pw = rw * cs * 1.06; ph = pw * rh / rw; } }
  const radius = S.crop ? 30 * cs * 3 * 1.2 : 10;
  st.insertAdjacentHTML("beforeend", `<div class="popwrap" style="left:${cx - pw / 2}px;top:${cy - ph / 2}px;width:${pw}px;height:${ph}px">
    <div class="pop"><img src="${pop.src}" style="border-radius:${radius}px"><div class="sheen" style="border-radius:${radius}px"></div>${S.play ? '<div class="play"></div>' : ""}</div></div>`);
  if (S.pills) st.insertAdjacentHTML("beforeend", `<div class="pills" style="top:${cy + ph / 2 + 70}px">${S.pills.map(p => `<div class="pill">${p}</div>`).join("")}</div>`);

  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  window.DONE = true;
}
main().catch(e => { document.title = "ERR " + e; window.DONE = true; });
</script></body></html>
