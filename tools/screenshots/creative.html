<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* App Store creative assets (October 2026): product page header 3840x1646 (21:9) and
     search results 3840x2560 (3:2). One idea each, little text, focal art kept to the centre. */
  * { margin: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #000; }
  body { font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; overflow: hidden; }
  .bg { position: absolute; inset: 0; }
  .bloom { position: absolute; border-radius: 50%; filter: blur(260px); }
  .grain { position: absolute; inset: 0; opacity: .10; mix-blend-mode: overlay; }
  .photo { position: absolute; border-radius: 14px;
           box-shadow: 0 120px 220px rgba(0,0,0,.55), 0 40px 80px rgba(0,0,0,.35); }
  .line { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-weight: 800; letter-spacing: -0.035em;
          text-shadow: 0 10px 60px rgba(0,0,0,.35); }
  .phone { position: absolute; filter: drop-shadow(0 120px 160px rgba(0,0,0,.5)); }
  .phone .scr { position: absolute; inset: 0; overflow: hidden; -webkit-mask-image: url(screen_mask.png); -webkit-mask-size: 100% 100%; }
  .phone .scr img { position: absolute; object-fit: cover; display: block; }
  .phone .fr { position: absolute; inset: 0; width: 100%; height: 100%; }
</style></head>
<body><div id="stage"></div>
<script>
const q = new URLSearchParams(location.search), kind = q.get("s") || "header";
const W = 3840, H = kind === "header" ? 1646 : 2560;
const st = document.getElementById("stage");
st.style.width = W + "px"; st.style.height = H + "px";
document.body.style.width = W + "px"; document.body.style.height = H + "px";
const C = "cap/v2/creative/";

function background() {
  st.insertAdjacentHTML("beforeend", `<div class="bg" style="background:linear-gradient(160deg,#0b1438 0%,#1d2f86 55%,#2b3aa0 100%)"></div>`);
  [["#3f5bd8", -.05, -.2, 1.0], ["#e0703a", .72, .45, .8], ["#f4b860", .38, .7, .7], ["#6d4bd8", .9, -.25, .9]].forEach(([c, x, y, s]) =>
    st.insertAdjacentHTML("beforeend", `<div class="bloom" style="width:${H * s * 1.4}px;height:${H * s * 1.4}px;left:${x * W}px;top:${y * H}px;background:${c};opacity:.55"></div>`));
  st.insertAdjacentHTML("beforeend", `<svg class="grain" width="${W}" height="${H}"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>`);
}

async function img(src) { const i = new Image(); i.src = src; await i.decode(); return i; }

// A framed photo, centred at (cx, cy), `h` tall, tilted by `rot` degrees.
async function photo(name, cx, cy, h, rot, z) {
  const i = await img(C + name + ".jpg"), w = h * i.naturalWidth / i.naturalHeight;
  st.insertAdjacentHTML("beforeend", `<img class="photo" src="${i.src}" style="left:${cx - w / 2}px;top:${cy - h / 2}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg);z-index:${z}">`);
}

async function header() {
  // One idea: your photos, beautifully framed. A fan of real engine renders across the centre,
  // a single short line above it; the outer thirds stay quiet for the narrower crops.
  background();
  const cy = H * .63, h = H * .66;
  // Five different photos, one per card.
  await photo("c_neon_noir", W / 2 - 1080, cy + 40, h * .86, -9, 1);
  await photo("c_cafe", W / 2 + 1080, cy + 40, h * .86, 9, 1);
  await photo("c_lake_aura", W / 2 - 560, cy + 10, h * .94, -4, 2);
  await photo("c_village", W / 2 + 560, cy + 10, h * .94, 4, 2);
  const hero = await img(C + "../iphone/01-hero-aura-pop.jpg"), hh = h * 1.02, hw = hh * hero.naturalWidth / hero.naturalHeight;
  st.insertAdjacentHTML("beforeend", `<img class="photo" src="${hero.src}" style="left:${W / 2 - hw / 2}px;top:${cy - hh / 2 - 10}px;width:${hw}px;height:${hh}px;z-index:3">`);
  st.insertAdjacentHTML("beforeend", `<div class="line" style="top:${H * .035}px;font-size:140px">Frame every shot</div>
    <div class="line" style="top:${H * .035 + 175}px;font-size:64px;font-weight:600;letter-spacing:-0.005em;opacity:.92">Smart photo looks, frames, watermarks and C2PA signatures that protect your work</div>`);
}

async function search() {
  // State the obvious: the real app, framing and watermarking a photo. Headline left, phone right,
  // two finished frames fanned behind the phone — all inside the central area.
  background();
  st.insertAdjacentHTML("beforeend", `<div class="line" style="text-align:left;left:330px;right:auto;top:${H * .26}px;font-size:250px;line-height:1.0">Frame &amp;<br>watermark<br>your photos</div>
    <div class="line" style="text-align:left;left:336px;right:auto;top:${H * .26 + 800}px;font-size:92px;line-height:1.25;font-weight:600;letter-spacing:-0.01em;opacity:.9">Smart photo looks. Real camera details.<br>Your logo and C2PA protection.</div>`);
  await photo("c_lake_aura", 2480, H * .55, H * .62, -8, 1);
  await photo("c_neon_noir", 3330, H * .55, H * .62, 8, 1);
  const ph = await fetch("phone.json").then(r => r.json()), PH = H * .92, k = PH / ph.phone[1], PW = ph.phone[0] * k;
  const [sx, sy, sw, sh] = ph.screen.map(v => v * k), x = 2900 - PW / 2, y = (H - PH) / 2 + 40;
  st.insertAdjacentHTML("beforeend", `<div class="phone" style="left:${x}px;top:${y}px;width:${PW}px;height:${PH}px;z-index:4">
    <div class="scr"><img src="${C}phone_hero.png" style="left:${sx}px;top:${sy}px;width:${sw}px;height:${sh}px"></div><img class="fr" src="frame.png"></div>`);
}

(kind === "header" ? header() : search()).then(async () => {
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  window.DONE = true;
}).catch(e => { document.title = "ERR " + e; window.DONE = true; });
</script></body></html>
